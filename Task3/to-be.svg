<text x="60" y="1030" class="sub" text-anchor="start">HAL печатает без облака.</text>
<text x="60" y="1060" class="sub" text-anchor="start">Платёж требует ответа эквайера.</text>
<text x="635" y="1090" class="sub" text-anchor="start">MDM управляет планшетами; мониторинг следит за очередями.</text>
<text x="30" y="1190" class="sub" text-anchor="start">Поток подключения: файл магазина → платформа → ИИ и товаровед → SAP → каталог POS. Подробности: Task2.</text>
<text x="30" y="1225" class="sub" text-anchor="start">У каждой продажи свой ID. Повторная доставка не создаёт новый чек или проводку. Правила конфликтов: README.</text>
<text x="30" y="1260" class="sub" text-anchor="start">Жёлтый — локальный HAL; зелёный — собственное преимущество; серый — HQ и внешние устройства / участники.</text>
<text x="30" y="1295" class="sub" text-anchor="start">Стрелки показывают основные обращения и сообщения. Ответы, служебные API и резервные соединения опущены.</text>
